[package]
name = "rust_maya"
version = "2.5.0"
rust-version = "1.96"
edition = "2024"

[dependencies]
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
cpal = { version = "0.18.2", optional = true }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
ureq = { version = "3.5.0", features = ["json"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
glam = { version = "0.34.1", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "exr", "hdr"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# USD binary (.usdc) layers are read with openusd and re-emitted as text for our parser;
# .usdz packages are unpacked with zip.
openusd = { version = "0.8.0", default-features = false }
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
# FBX binary arrays are zlib-compressed.
flate2 = "1.1.10"

[features]
default = ["voice"]
voice = ["dep:cpal", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
